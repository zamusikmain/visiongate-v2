<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisionGate · Overview</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
</head>
<body>
<header></header>
<main class="wide">
  <div class="page-head">
    <div><h1 data-i18n="ov_title"></h1><p class="hint" data-i18n="ov_sub"></p></div>
    <select id="days" style="width:auto">
      <option value="7">7</option><option value="14" selected>14</option><option value="30">30</option><option value="90">90</option>
    </select>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="dash-grid dash-row">
    <div class="card">
      <div class="card-title"><h2 data-i18n="ch_daily"></h2>
        <div class="legend"><span><i class="dot" style="background:var(--c-received)"></i><span data-i18n="ch_received"></span></span>
          <span><i class="dot" style="background:var(--c-processed)"></i><span data-i18n="ch_processed"></span></span></div></div>
      <div class="chart" id="daily"></div>
    </div>
    <div class="card"><div class="card-title"><h2 data-i18n="ch_summary"></h2></div><div id="summary"></div></div>
  </div>
  <div class="dash-grid dash-row">
    <div class="card"><div class="card-title"><h2 data-i18n="ch_reasons"></h2><a class="hint" href="/reasons" data-i18n="nav_reasons"></a></div>
      <div id="reasons"></div></div>
    <div class="card"><div class="card-title"><h2 data-i18n="ch_metrics"></h2></div><div class="metrics" id="metrics"></div></div>
  </div>
  <div class="card">
    <div class="card-title"><h2 data-i18n="ch_recent"></h2><a href="/submissions" data-i18n="all_link"></a></div>
    <div style="overflow-x:auto" id="recent"></div>
  </div>
</main>
<script src="/static/common.js"></script>
<script src="/static/charts.js"></script>
<script>
VG.header("/");
VG.applyI18n();
const daysSel = document.querySelector("#days");
daysSel.querySelectorAll("option").forEach(o => o.textContent = VG.t("days_n", { n: o.value }));

const empty = (t, h) => `<div class="empty"><b>${VG.esc(t)}</b>${VG.esc(h || "")}</div>`;

function recentTable(rows) {
  if (!rows.length) return empty(VG.t("empty_title"), VG.t("empty_hint"));
  return `<table class="tbl"><thead><tr><th>${VG.t("col_id")}</th><th>${VG.t("col_model")}</th><th>IMEI</th>
    <th>${VG.t("col_date")}</th><th>${VG.t("col_status")}</th><th>${VG.t("col_reasons")}</th><th>${VG.t("col_conf")}</th></tr></thead><tbody>` +
    rows.map(r => {
      const s = r.summary || {};
      return `<tr onclick="location.href='/submissions?id=${r.id}'"><td>#${r.id}</td><td>${VG.esc(s.model || "—")}</td>
        <td class="mono">${VG.esc(VG.maskImei(r.imei) || "—")}</td><td>${VG.fmtDate(r.created_at)}</td>
        <td>${VG.badge("b-" + r.bucket, VG.bucketLabel(r.bucket))}</td>
        <td>${(s.reasons || []).map(c => `<span class="chip">${VG.esc(VG.reasonLabel(c))}</span>`).join("") || "—"}</td>
        <td class="conf-${s.confidence}">${s.confidence || "—"}</td></tr>`;
    }).join("") + "</tbody></table>";
}

async function load() {
  const d = await VG.json(`/api/stats/overview?days=${daysSel.value}`);
  const b = d.buckets, tot = d.total;
  const kpi = (key, label, val, color, sub) => `<a class="kpi" href="/submissions${key ? "?status=" + key : ""}">
    <div class="k-label">${color ? `<i class="dot" style="background:${color}"></i>` : ""}${VG.esc(label)}</div>
    <div class="k-val">${val}</div><div class="k-sub">${sub || "&nbsp;"}</div></a>`;
  const pct = v => tot ? Math.round(100 * v / tot) + "%" : "—";
  document.querySelector("#kpis").innerHTML =
    kpi("", VG.t("k_total"), tot, "", "") +
    ["approved", "rejected", "review"].map(k => kpi(k, VG.bucketLabel(k), b[k], BUCKET_COLOR[k], pct(b[k]))).join("") +
    `<a class="kpi" href="/queue"><div class="k-label"><i class="dot" style="background:${BUCKET_COLOR.processing}"></i>${VG.bucketLabel("processing")}</div>
      <div class="k-val">${b.processing}</div><div class="k-sub">${VG.t("k_processing_sub")}</div></a>`;
  const daily = document.querySelector("#daily");
  if (d.daily.some(x => x.received || x.processed)) VGChart.daily(daily, d.daily);
  else daily.innerHTML = empty(VG.t("empty_title"), VG.t("empty_hint"));
  document.querySelector("#summary").innerHTML = tot ? VGChart.hbars(["approved", "rejected", "review", "processing"].map(k => ({
    label: VG.bucketLabel(k), value: tot ? Math.round(100 * b[k] / tot) : 0, suffix: "%", color: BUCKET_COLOR[k],
    href: k === "processing" ? "/queue" : `/submissions?status=${k}` })), 100) : empty(VG.t("empty_title"));
  document.querySelector("#reasons").innerHTML = d.reasons.length ? VGChart.hbars(d.reasons.map(r => ({
    label: VG.reasonLabel(r.code), value: r.count, href: `/submissions?reason=${r.code}`, color: "var(--c-rejected)" }))) :
    empty(VG.t("empty_reasons"));
  const m = (v, label) => `<div class="metric"><b>${v ?? "—"}</b><span>${VG.esc(label)}</span></div>`;
  document.querySelector("#metrics").innerHTML = m(d.avg_fast_s, VG.t("m_fast")) + m(d.avg_vlm_s, VG.t("m_vlm")) +
    m(d.high_conf_share == null ? null : d.high_conf_share + "%", VG.t("m_high"));
  document.querySelector("#recent").innerHTML = recentTable(d.recent);
}
daysSel.onchange = load;
load();
setInterval(load, 15000);
</script>
</body>
</html>
